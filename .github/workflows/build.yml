name: Build & Release

on:
  push:
    tags: ['v*']
  # SPEC §5.2：模型是外部下载步骤，首次跑通前 MUST NOT 进发布流程——先用手动触发验证整条链
  workflow_dispatch:

jobs:
  build-mac-arm:
    name: Build (macOS ARM)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert arm64 runner
        run: |-
          test "$(uname -m)" = arm64 ||
            { echo "::error::runner 不是 arm64——产物会是 x86_64 却被当成 ARM 发出去，需改用 macos-14 并显式 --target"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # fetch-mt-model.mjs 用 `python3 -m venv` 建 venv，不钉版本就会用 runner 自带的解释器，
      # 而 torch 要求 >= 3.10——系统自带的 3.9 会让 pip 报「(from versions: none)」（一个候选都没有）。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: src-tauri/assets/models/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16
          key: asr-model-${{ hashFiles('scripts/fetch-model.mjs') }}
          restore-keys: asr-model-

      - name: Cache MT models
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/assets/models/mt
            .cache/mt
          key: mt-models-${{ hashFiles('scripts/fetch-mt-model.mjs') }}
          restore-keys: mt-models-

      - name: Install typeshare CLI
        run: typeshare --version 2>/dev/null | grep -q 1.13.4 || cargo install typeshare-cli --version 1.13.4 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch MT models
        run: pnpm fetch:mt

      - name: Build Tauri app (DMG)
        run: pnpm tauri build

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AudioScript-macOS-ARM
          path: src-tauri/target/release/bundle/dmg/*.dmg
          compression-level: 0

  # 两个平台的完整打包，产物挂进 Release。
  # ⚠️ 这两条路径**从来没有在真机上跑过**——CI 只证明它能编过、能打包。
  # 采集（WASAPI / PipeWire）、置顶、托盘、热键在非 macOS 上的行为全是未知数。
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # ct2rs 与 sherpa-onnx 的 CMake 构建用 /MT（静态 CRT），而 Rust 在 windows-msvc 上
      # 默认链 /MD（动态）→ LNK2038「RuntimeLibrary mismatch」+ LNK1169 重复符号。
      # 把 Rust 侧也对齐到静态 CRT 是唯一不必打补丁改各依赖 build.rs 的方向。
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache typeshare CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-1.13.4-${{ runner.os }}

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: src-tauri/assets/models/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16
          key: asr-model-${{ hashFiles('scripts/fetch-model.mjs') }}
          restore-keys: asr-model-

      - name: Cache MT models
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/assets/models/mt
            .cache/mt
          key: mt-models-${{ hashFiles('scripts/fetch-mt-model.mjs') }}
          restore-keys: mt-models-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install typeshare CLI
        shell: bash
        run: typeshare --version 2>/dev/null | grep -q 1.13.4 || cargo install typeshare-cli --version 1.13.4 --locked

      - name: Fetch MT models
        run: pnpm fetch:mt

      - name: Build Tauri app
        run: pnpm tauri build --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AudioScript-Windows-x64
          path: |-
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          compression-level: 0

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # CI 里没有 FUSE，AppImage 工具链要显式走解包运行
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libssl-dev build-essential libxdo-dev \
            libpipewire-0.3-dev cmake ninja-build

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache typeshare CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/typeshare
          key: typeshare-1.13.4-${{ runner.os }}

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: src-tauri/assets/models/sherpa-onnx-streaming-zipformer-small-bilingual-zh-en-2023-02-16
          key: asr-model-${{ hashFiles('scripts/fetch-model.mjs') }}
          restore-keys: asr-model-

      - name: Cache MT models
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/assets/models/mt
            .cache/mt
          key: mt-models-${{ hashFiles('scripts/fetch-mt-model.mjs') }}
          restore-keys: mt-models-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install typeshare CLI
        run: typeshare --version 2>/dev/null | grep -q 1.13.4 || cargo install typeshare-cli --version 1.13.4 --locked

      - name: Fetch MT models
        run: pnpm fetch:mt

      - name: Build Tauri app
        run: pnpm tauri build --bundles deb,appimage

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AudioScript-Linux-x64
          path: |-
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          compression-level: 0

  release:
    name: Create Release
    needs: [build-mac-arm, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AudioScript ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # ⚠️ 路径必须带上 archive 里的子目录层级：upload-artifact 以「所有匹配文件的
          # 最近公共祖先」为根，Windows 的 nsis/ 与 msi/ 因此是子目录而非文件。
          # 少一层就会得到「Pattern ... does not match any files」并让整个 release 失败。
          files: |
            AudioScript-macOS-ARM/*.dmg
            AudioScript-Windows-x64/nsis/*.exe
            AudioScript-Windows-x64/msi/*.msi
            AudioScript-Linux-x64/deb/*.deb
            AudioScript-Linux-x64/appimage/*.AppImage
